spring.application.name=novosiga

#Definir o banco de dados para a conexão
spring.datasource.url=${SIF_DB_URL:jdbc:postgresql://localhost:5432/db_novosiga}
spring.datasource.username=${SIF_DB_USER:postgres}
spring.datasource.password=${SIF_DB_PASSWORD:}

#Configurações do JPA/Hibernate

#Atualiza o banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=update

#Limpar o cache para a execução do Thymeleaf 
spring.thymeleaf.cache=false

#Exibir no terminal o SQL sendo executado
spring.jpa.show-sql=true

#Limitar o tamanho máximo do arquivo enviado para 5MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB